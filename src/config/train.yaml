# Main FoundationIMU training config (src.train).
defaults:
  - model     : continuous_foundation_imu
  - data      : all_data
  - optim     : muon_adamw
  - loss      : velocity+lang+denoise+traj
  - _self_
  - experiment: null

hydra:
  run:
    # Run outputs live under FOUNDATIONIMU_EXP_ROOT (default: ./experiments).
    dir: ${machine-conf:exp_root}/${now:%Y-%m-%d}/${now:%H-%M-%S}

# Single-process debug switch: one device, no DDP, zero dataloader workers, so breakpoints work.
debug: false

data_conf:
  # Windowing method is selected via the data/window group (sliding | random).
  window_size: 4096.
  window_step: 4096.
  window_unit: ms  # sample | ms
  # Fraction (0, 1] of train sequences kept per corpus; valid is never subsampled.
  subsample  : 1.0

wandb:
  enable : true
  entity : ${oc.env:WANDB_ENTITY,null}
  project: FoundationIMU
  runid  : AllData_Train

meta:
  seed      : 0
  ema_decay : [0.8, 0.9]  # [start, end] momentum, cosine-annealed over the fit
  # Checkpoint every N epochs (all kept).
  ckpt_every_n_epochs: 1
  output    : ${hydra:runtime.output_dir}
  allow_ddp_unused_param: false
  
  # Checkpoint to resume from; single-quote the whole CLI override so the ckpt name's '=' survives.
  resume_from: null
  # With resume_from set, decay all LRs linearly to zero over this many steps, then stop (null = constant LR).
  cooldown_steps: null
  # Global step at which the cooldown starts; null = the first step of this process.
  cooldown_from_step: null
  # true: restore weights + optimizer + counters. false: load weights only (finetune).
  resume_full_state: true

loader:
  batch_size     : 128
  num_workers    : 8
  prefetch_factor: 1

trainer:
  accelerator            : auto
  devices                : auto
  precision              : bf16-true
  max_epochs             : 32
  gradient_clip_val      : 1.0
  log_every_n_steps      : 1
  accumulate_grad_batches: 1
