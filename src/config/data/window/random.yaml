# Train: randomly placed windows. Valid: fixed non-overlapping sliding windows, so metrics stay comparable.
train:
  _target_   : src.data.imu.window.RandomWindow_IMU
  window_size: ${data_conf.window_size}
  window_unit: ${data_conf.window_unit}
valid:
  _target_   : src.data.imu.window.SlidingWindow_IMU
  window_size: ${data_conf.window_size}
  window_unit: ${data_conf.window_unit}
  step_size  : ${data_conf.window_size}
