# Nymeria + NaturalMotion + BONES-SEED (G1, SOMA) in one ConcatDataset, with an independent
# transform slot per source (e.g. data/transform@data.nymeria_t=...).
# Sources are inlined because Hydra replaces list defaults instead of concatenating them.
defaults:
  - transform@nymeria_t      : human_xsens
  - transform@naturalmotion_t: human_xsens
  - transform@bones_soma_t   : human_xsens
  - transform@bones_g1_t     : humanoid_bones
  - window                   : random
  - _self_

train:
  - _target_   : src.data.util.build_corpus
    _recursive_: false
    reader     :
      _target_      : src.data.imu.nymeria_processed_lang.Nymeria_XSens_Processed_IMU_Language
      target_sensors: ["pelvis", "head", "torso_t8", "left_shoulder", "left_upper_arm", "left_forearm", "left_hand", "right_shoulder", "right_upper_arm", "right_forearm", "right_hand", "left_upper_leg", "left_lower_leg", "left_foot", "right_upper_leg", "right_lower_leg", "right_foot"]
    root       : "${machine-conf:cache_root}/nymeria_imu_processed_v3"
    stems      : src/config/data/stems/nymeria_train.txt
    layers     : ["${data.nymeria_t.train}", "${data.window.train}"]
  - _target_   : src.data.util.build_corpus
    _recursive_: false
    reader     :
      _target_      : src.data.imu.naturalmotion_processed_lang.NaturalMotion_XSens_Processed_IMU_Language
      target_sensors: ["pelvis", "head", "torso_t8", "left_shoulder", "left_upper_arm", "left_forearm", "left_hand", "right_shoulder", "right_upper_arm", "right_forearm", "right_hand", "left_upper_leg", "left_lower_leg", "left_foot", "right_upper_leg", "right_lower_leg", "right_foot"]
    root       : "${machine-conf:cache_root}/vt_natural_motion_processed_v3"
    stems      : src/config/data/stems/naturalmotion_train.txt
    layers     : ["${data.naturalmotion_t.train}", "${data.window.train}"]
  # G1 and SOMA keep separate transform slots since their device sets differ.
  - _target_   : src.data.util.build_corpus
    _recursive_: false
    reader     : {_target_: src.data.imu.bones_seed_processed.Bones_Seed_G1_Processed_IMU_w_Lang}
    root       : "${machine-conf:cache_root}/bones_seed_processed_v4"
    stems      : src/config/data/stems/bones_segments/bones_g1_train.txt
    layers     : ["${data.bones_g1_t.train}", "${data.window.train}"]
  - _target_   : src.data.util.build_corpus
    _recursive_: false
    reader     : {_target_: src.data.imu.bones_seed_processed.Bones_Seed_SOMA_Processed_IMU_w_Lang}
    root       : "${machine-conf:cache_root}/bones_seed_soma_processed_v4"
    stems      : src/config/data/stems/bones_segments/bones_soma_train.txt
    layers     : ["${data.bones_soma_t.train}", "${data.window.train}"]

valid:
  - _target_   : src.data.util.build_corpus
    _recursive_: false
    reader     :
      _target_      : src.data.imu.nymeria_processed_lang.Nymeria_XSens_Processed_IMU_Language
      target_sensors: ["pelvis", "head", "torso_t8", "left_shoulder", "left_upper_arm", "left_forearm", "left_hand", "right_shoulder", "right_upper_arm", "right_forearm", "right_hand", "left_upper_leg", "left_lower_leg", "left_foot", "right_upper_leg", "right_lower_leg", "right_foot"]
    root       : "${machine-conf:cache_root}/nymeria_imu_processed_v3"
    stems      : src/config/data/stems/nymeria_valid.txt
    layers     : ["${data.nymeria_t.valid}", "${data.window.valid}"]
  - _target_   : src.data.util.build_corpus
    _recursive_: false
    reader     :
      _target_      : src.data.imu.naturalmotion_processed_lang.NaturalMotion_XSens_Processed_IMU_Language
      target_sensors: ["pelvis", "head", "torso_t8", "left_shoulder", "left_upper_arm", "left_forearm", "left_hand", "right_shoulder", "right_upper_arm", "right_forearm", "right_hand", "left_upper_leg", "left_lower_leg", "left_foot", "right_upper_leg", "right_lower_leg", "right_foot"]
    root       : "${machine-conf:cache_root}/vt_natural_motion_processed_v3"
    stems      : src/config/data/stems/naturalmotion_valid.txt
    layers     : ["${data.naturalmotion_t.valid}", "${data.window.valid}"]
  # G1 valid = standard holdout + human2robot (complex categories, never trained on G1).
  - _target_   : src.data.util.build_corpus
    _recursive_: false
    reader     : {_target_: src.data.imu.bones_seed_processed.Bones_Seed_G1_Processed_IMU_w_Lang}
    root       : "${machine-conf:cache_root}/bones_seed_processed_v4"
    stems      :
      - src/config/data/stems/bones_segments/bones_g1_valid.txt
      - src/config/data/stems/bones_segments/bones_g1_human2robot.txt
    layers     : ["${data.bones_g1_t.valid}", "${data.window.valid}"]
  - _target_   : src.data.util.build_corpus
    _recursive_: false
    reader     : {_target_: src.data.imu.bones_seed_processed.Bones_Seed_SOMA_Processed_IMU_w_Lang}
    root       : "${machine-conf:cache_root}/bones_seed_soma_processed_v4"
    stems      : src/config/data/stems/bones_segments/bones_soma_valid.txt
    layers     : ["${data.bones_soma_t.valid}", "${data.window.valid}"]
