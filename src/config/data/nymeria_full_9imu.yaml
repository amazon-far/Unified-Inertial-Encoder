# Raw Nymeria XSens sequences (9-IMU subset) under ${machine-conf:data_root}/nymeria_imu.
# Dropped sequences stay as [EXCLUDED ...] comments with the reason.
defaults:
  - transform: empty
  - window   : sliding
  - _self_

train:
  # The first entry defines the shared anchors; all other entries merge them and override only the path.
  - &seq
    _target_   : src.data.util.build_nested_seq
    _recursive_: false   # layers must reach build_nested_seq un-instantiated
    layers:
      - &nymeria
        _target_      : src.data.imu.nymeria.Nymeria_XSens_IMU
        target_sensors: ["left_foot", "left_lower_leg", "right_foot", "right_lower_leg", "left_hand", "left_forearm", "right_hand", "right_forearm", "pelvis"]
        path          : ${machine-conf:data_root}/nymeria_imu/20230607_s0_james_johnson_act0_e72nhq
      - &train_transform ${data.transform.train}
      - &train_window ${data.window.train}

  - {<<: *seq, layers: [{<<: *nymeria, path: "${machine-conf:data_root}/nymeria_imu/20230607_s0_james_johnson_act1_7xwm28"}, *train_transform, *train_window]}
# [EXCLUDED gap-straddling window]   - {<<: *seq, layers: [{<<: *nymeria, path: "${machine-conf:data_root}/nymeria_imu/20230607_s0_james_johnson_act3_ifj2gc"}, *train_transform, *train_window]}
