# NaturalMotion (XSens MVN, .h5) recordings from ${machine-conf:data_root}/vt_natural_motion/h5-dataset,
# 9-IMU set, split balanced by duration.
defaults:
  - transform: empty
  - window   : sliding
  - _self_

train:
  # The first entry defines the shared anchors; all other entries merge them and override only the path.
  - &seq
    _target_   : src.data.util.build_nested_seq
    _recursive_: false   # layers must reach build_nested_seq un-instantiated
    layers:
      - &nm
        _target_      : src.data.imu.naturalmotion.NaturalMotion_XSens_IMU
        target_sensors: ["left_foot", "left_lower_leg", "right_foot", "right_lower_leg", "left_hand", "left_forearm", "right_hand", "right_forearm", "pelvis"]
        path          : ${machine-conf:data_root}/vt_natural_motion/h5-dataset/P10_Day_1_2.h5
      - &train_transform ${data.transform.train}
      - &train_window ${data.window.train}

  - {<<: *seq, layers: [{<<: *nm, path: "${machine-conf:data_root}/vt_natural_motion/h5-dataset/P11_Day_1_1.h5"}, *train_transform, *train_window]}
  - {<<: *seq, layers: [{<<: *nm, path: "${machine-conf:data_root}/vt_natural_motion/h5-dataset/P11_Day_1_2.h5"}, *train_transform, *train_window]}
  - {<<: *seq, layers: [{<<: *nm, path: "${machine-conf:data_root}/vt_natural_motion/h5-dataset/P12_Day_1_1.h5"}, *train_transform, *train_window]}
  - {<<: *seq, layers: [{<<: *nm, path: "${machine-conf:data_root}/vt_natural_motion/h5-dataset/P12_Day_1_2.h5"}, *train_transform, *train_window]}
  - {<<: *seq, layers: [{<<: *nm, path: "${machine-conf:data_root}/vt_natural_motion/h5-dataset/P13_Day_1_1.h5"}, *train_transform, *train_window]}
  - {<<: *seq, layers: [{<<: *nm, path: "${machine-conf:data_root}/vt_natural_motion/h5-dataset/P13_Day_1_2.h5"}, *train_transform, *train_window]}
  - {<<: *seq, layers: [{<<: *nm, path: "${machine-conf:data_root}/vt_natural_motion/h5-dataset/P13_Day_1_4.h5"}, *train_transform, *train_window]}
  - {<<: *seq, layers: [{<<: *nm, path: "${machine-conf:data_root}/vt_natural_motion/h5-dataset/P13_Day_2_1.h5"}, *train_transform, *train_window]}
  - {<<: *seq, layers: [{<<: *nm, path: "${machine-conf:data_root}/vt_natural_motion/h5-dataset/P13_Day_2_2.h5"}, *train_transform, *train_window]}
