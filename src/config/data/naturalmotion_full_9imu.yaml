  - {<<: *seq, layers: [{<<: *nm, path: "${machine-conf:data_root}/vt_natural_motion/h5-dataset/P1_Day_1_2.h5"}, *train_transform, *train_window]}
  - {<<: *seq, layers: [{<<: *nm, path: "${machine-conf:data_root}/vt_natural_motion/h5-dataset/P1_Day_1_3.h5"}, *train_transform, *train_window]}
