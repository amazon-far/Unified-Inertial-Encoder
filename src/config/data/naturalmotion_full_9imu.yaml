valid:
  # Valid windows stay fixed (sliding) regardless of data/window, so metrics stay comparable.
  - <<: *seq
    layers:
      - {<<: *nm, path: "${machine-conf:data_root}/vt_natural_motion/h5-dataset/P10_Day_1_1.h5"}
      - &valid_transform ${data.transform.valid}
      - &valid_window ${data.window.valid}
  - {<<: *seq, layers: [{<<: *nm, path: "${machine-conf:data_root}/vt_natural_motion/h5-dataset/P13_Day_1_3.h5"}, *valid_transform, *valid_window]}
