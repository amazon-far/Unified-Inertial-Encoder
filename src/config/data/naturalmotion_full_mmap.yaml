valid:
  # Valid windows stay fixed (sliding) regardless of data/window, so metrics stay comparable.
  - <<: *seq
    layers:
      - {<<: *nm, path: "${machine-conf:cache_root}/vt_natural_motion_processed_v3/P10_Day_1_1"}
      - &valid_transform ${data.transform.valid}
      - &valid_window ${data.window.valid}
  - {<<: *seq, layers: [{<<: *nm, path: "${machine-conf:cache_root}/vt_natural_motion_processed_v3/P13_Day_1_3"}, *valid_transform, *valid_window]}
