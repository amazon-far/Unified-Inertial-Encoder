# Denoise pipeline: gravity, noise and bias on both splits; train also drops devices, valid keeps them all.
# Corruption must precede RandomDropDevice: AddBias sizes its per-device knots to the full device count.
train:
  - _target_: src.data.imu.transform.AddGravity
  - _target_: src.data.imu.transform.AddNoise
    acc_noise_density : 1.e-2
    gyro_noise_density: 3.e-4
  - _target_: src.data.imu.transform.AddBias
    acc_bias_randwalk : 5.e-4
    gyro_bias_randwalk: 5.e-5
  - _target_  : src.data.imu.transform.RandomDropDevice

valid:
  - _target_: src.data.imu.transform.AddGravity
  - _target_: src.data.imu.transform.AddNoise
    acc_noise_density : 1.e-2
    gyro_noise_density: 3.e-4
  - _target_: src.data.imu.transform.AddBias
    acc_bias_randwalk : 5.e-4
    gyro_bias_randwalk: 5.e-5
