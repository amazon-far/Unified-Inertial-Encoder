# @package _global_
# EXP21: exp20_ablation_joint with the joint stream corrupted too (*_real_disturb_joint stacks).
# Usage: python -m src.train experiment=exp21_ablation_joint_corrupt
defaults:
  - /data/transform@data.superodom_t             : prune_device
  - override /model                              : continuous_foundation_imu_joint
  - override /data/transform@data.bones_soma_t   : human_xsens_real_disturb_joint
  - override /data/transform@data.nymeria_t      : human_xsens_real_disturb_joint
  - override /data/transform@data.naturalmotion_t: human_xsens_real_disturb_joint
  - override /data/transform@data.bones_g1_t     : humanoid_bones_real_disturb_joint

data:
  train:
    - _target_   : src.data.util.build_corpus
      _recursive_: false
      reader     :
        _target_ : src.data.joint.rootjoint_sequence.RootJoint_Nymeria_Lang
        joints   : relative
        lang_root: "${machine-conf:cache_root}/nymeria_imu_processed_v3"
      root       : "${machine-conf:cache_root}/rootjoint_v1/nymeria"
      stems      : src/config/data/stems/nymeria_train.txt
      layers     : ["${data.nymeria_t.train}", "${data.window.train}"]
    - _target_   : src.data.util.build_corpus
      _recursive_: false
      reader     :
        _target_ : src.data.joint.rootjoint_sequence.RootJoint_NaturalMotion_Lang
        joints   : relative
        lang_root: "${machine-conf:cache_root}/vt_natural_motion_processed_v3"
      root       : "${machine-conf:cache_root}/rootjoint_v1/naturalmotion"
      stems      : src/config/data/stems/naturalmotion_train.txt
      layers     : ["${data.naturalmotion_t.train}", "${data.window.train}"]
    - _target_   : src.data.util.build_corpus
      _recursive_: false
      reader     :
        _target_ : src.data.joint.rootjoint_sequence.RootJoint_BonesSOMA_Lang
        joints   : relative
        lang_root: "${machine-conf:cache_root}/bones_seed_soma_processed_v4"
      root       : "${machine-conf:cache_root}/rootjoint_v1/bones_soma"
      stems      : src/config/data/stems/bones_segments/bones_soma_train.txt
      layers     : ["${data.bones_soma_t.train}", "${data.window.train}"]
    - _target_   : src.data.util.build_corpus
      _recursive_: false
      reader     :
        _target_ : src.data.joint.rootjoint_sequence.RootJoint_BonesG1_Lang
        joints   : relative
        lang_root: "${machine-conf:cache_root}/bones_seed_processed_v4"
      root       : "${machine-conf:cache_root}/rootjoint_v1/bones_g1"
      stems      : src/config/data/stems/bones_segments/bones_g1_train.txt
      layers     : ["${data.bones_g1_t.train}", "${data.window.train}"]

  valid:
    - _target_   : src.data.util.build_corpus
      _recursive_: false
      reader     :
        _target_ : src.data.joint.rootjoint_sequence.RootJoint_Nymeria_Lang
        joints   : relative
        lang_root: "${machine-conf:cache_root}/nymeria_imu_processed_v3"
      root       : "${machine-conf:cache_root}/rootjoint_v1/nymeria"
      stems      : src/config/data/stems/nymeria_valid.txt
      layers     : ["${data.nymeria_t.valid}", "${data.window.valid}"]
    - _target_   : src.data.util.build_corpus
      _recursive_: false
      reader     :
        _target_ : src.data.joint.rootjoint_sequence.RootJoint_NaturalMotion_Lang
        joints   : relative
        lang_root: "${machine-conf:cache_root}/vt_natural_motion_processed_v3"
      root       : "${machine-conf:cache_root}/rootjoint_v1/naturalmotion"
      stems      : src/config/data/stems/naturalmotion_valid.txt
      layers     : ["${data.naturalmotion_t.valid}", "${data.window.valid}"]
    - _target_   : src.data.util.build_corpus
      _recursive_: false
      reader     :
        _target_ : src.data.joint.rootjoint_sequence.RootJoint_BonesSOMA_Lang
        joints   : relative
        lang_root: "${machine-conf:cache_root}/bones_seed_soma_processed_v4"
      root       : "${machine-conf:cache_root}/rootjoint_v1/bones_soma"
      stems      : src/config/data/stems/bones_segments/bones_soma_valid.txt
      layers     : ["${data.bones_soma_t.valid}", "${data.window.valid}"]
    - _target_   : src.data.util.build_corpus
      _recursive_: false
      reader     :
        _target_ : src.data.joint.rootjoint_sequence.RootJoint_BonesG1_Lang
        joints   : relative
        lang_root: "${machine-conf:cache_root}/bones_seed_processed_v4"
      root       : "${machine-conf:cache_root}/rootjoint_v1/bones_g1"
      stems      :
        - src/config/data/stems/bones_segments/bones_g1_valid.txt
        - src/config/data/stems/bones_segments/bones_g1_human2robot.txt
      layers     : ["${data.bones_g1_t.valid}", "${data.window.valid}"]
    - _target_   : src.data.util.build_corpus
      _recursive_: false
      reader     :
        _target_ : src.data.joint.rootjoint_sequence.RootJoint_SuperOdom_Lang
        joints   : relative
        lang_root: "${machine-conf:cache_root}/humanoid_superodom_clips_v2"
      root       : "${machine-conf:cache_root}/rootjoint_v1/superodom_clips"
      stems      : src/config/data/stems/superodom_clips_eval.txt
      layers     : ["${data.superodom_t.valid}", "${data.window.valid}"]

wandb:
  runid: Exp21_Ablation_Joint_Corrupt

loader:
  batch_size: 128

trainer:
  max_epochs: 20
