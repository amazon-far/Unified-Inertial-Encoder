# @package _global_
# EXP17-f64: data-scaling ablation, exp15_full_train_C on a nested 1/64 subset of the train sequences of every corpus.
# Usage: python -m src.train experiment=exp17_scale_f64
defaults:
  - exp15_full_train_C

data_conf:
  subsample: 0.015625

trainer:
  max_epochs: 4096
  check_val_every_n_epoch: 64

meta:
  ckpt_every_n_epochs: 64

wandb:
  runid: Exp17_Scale_f64
