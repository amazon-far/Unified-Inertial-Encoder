# @package _global_
# EXP22-d256: model-size point of the scaling sweep, exp15_full_train_C with token_dim 256.
# Usage: python -m src.train experiment=exp22_scale_d256
defaults:
  - exp15_full_train_C

model:
  token_dim         : 256
  feature_from_trunk: [1, 3]
  trunk:
    layer     : 4
    layer_type: [device, full, device, full]
    num_heads : 4

trainer:
  max_epochs: 20

wandb:
  runid: Exp22_Scale_d256
