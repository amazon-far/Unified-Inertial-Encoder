# @package _global_
# EXP19: AirIO + joints baseline (IMUnet JointsAirIONetworkIMUOnly) on Nymeria: pelvis IMU + 11 relative joints, 5 s windows.
# Usage: python -m src.train_airio --config-name train_airio_joints experiment=exp19_airio_joints_nymeria
defaults:
  - override /data/transform@data.nymeria_t: human_xsens_real_disturb

data_conf:
  window_size: 1200

data:
  train:
    - _target_   : src.data.util.build_corpus
      _recursive_: false
      reader     : {_target_: src.data.joint.rootjoint_sequence.RootJoint_IMU_Sequence, joints: relative}
      root       : "${machine-conf:cache_root}/rootjoint_v1/nymeria"
      stems      : src/config/data/stems/nymeria_train.txt
      layers     : ["${data.nymeria_t.train}", "${data.window.train}"]

  valid:
    - _target_   : src.data.util.build_corpus
      _recursive_: false
      reader     : {_target_: src.data.joint.rootjoint_sequence.RootJoint_IMU_Sequence, joints: relative}
      root       : "${machine-conf:cache_root}/rootjoint_v1/nymeria"
      stems      : src/config/data/stems/nymeria_valid.txt
      layers     : ["${data.nymeria_t.valid}", "${data.window.valid}"]

wandb:
  runid: Exp19_AirIOJoints_nymeria

trainer:
  max_epochs: 192
