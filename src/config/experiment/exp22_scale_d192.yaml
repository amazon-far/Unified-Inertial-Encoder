# @package _global_
# EXP22-d192: model-size point of the scaling sweep, exp15_full_train_C with token_dim 192.
# Usage: python -m src.train experiment=exp22_scale_d192
defaults:
  - exp15_full_train_C

model:
  token_dim         : 192
  feature_from_trunk: [1, 3]
  trunk:
    layer     : 4
    layer_type: [device, full, device, full]
    num_heads : 3

trainer:
  max_epochs: 20

wandb:
  runid: Exp22_Scale_d192
