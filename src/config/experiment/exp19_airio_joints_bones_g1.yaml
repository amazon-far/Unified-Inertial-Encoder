# @package _global_
# EXP19: AirIO + joints baseline (IMUnet JointsAirIONetworkIMUOnly) on BONES-SEED G1: pelvis IMU + 11 relative joints, 5 s windows.
# Usage: python -m src.train_airio --config-name train_airio_joints experiment=exp19_airio_joints_bones_g1
defaults:
  - override /data/transform@data.bones_g1_t: humanoid_bones_real_disturb

data_conf:
  window_size: 600

data:
  train:
    - _target_   : src.data.util.build_corpus
      _recursive_: false
      reader     : {_target_: src.data.joint.rootjoint_sequence.RootJoint_IMU_Sequence, joints: relative}
      root       : "${machine-conf:cache_root}/rootjoint_v1/bones_g1"
      stems      : src/config/data/stems/bones_segments/bones_g1_train.txt
      layers     : ["${data.bones_g1_t.train}", "${data.window.train}"]

  valid:
    - _target_   : src.data.util.build_corpus
      _recursive_: false
      reader     : {_target_: src.data.joint.rootjoint_sequence.RootJoint_IMU_Sequence, joints: relative}
      root       : "${machine-conf:cache_root}/rootjoint_v1/bones_g1"
      stems      : [src/config/data/stems/bones_segments/bones_g1_valid.txt, src/config/data/stems/bones_segments/bones_g1_human2robot.txt]
      layers     : ["${data.bones_g1_t.valid}", "${data.window.valid}"]

wandb:
  runid: Exp19_AirIOJoints_bones_g1

trainer:
  max_epochs: 84
