# @package _global_
# EXP9: TLIO baseline on BONES-SEED G1, pelvis IMU only.
# Usage: python -m src.train_tlio experiment=exp9_tlio_baseline_bones_g1
defaults:
  - override /data/transform@data.bones_g1_t: humanoid_bones_real_disturb

data:
  train:
    - _target_   : src.data.util.build_corpus
      _recursive_: false
      reader     : {_target_: src.data.imu.bones_seed_processed.Bones_Seed_G1_Processed_IMU_w_Lang, target_sensors: ["pelvis"]}
      root       : "${machine-conf:cache_root}/bones_seed_processed_v4"
      stems      : src/config/data/stems/bones_segments/bones_g1_train.txt
      layers     : ["${data.bones_g1_t.train}", "${data.window.train}"]

  valid:
    - _target_   : src.data.util.build_corpus
      _recursive_: false
      reader     : {_target_: src.data.imu.bones_seed_processed.Bones_Seed_G1_Processed_IMU_w_Lang, target_sensors: ["pelvis"]}
      root       : "${machine-conf:cache_root}/bones_seed_processed_v4"
      stems      :
        - src/config/data/stems/bones_segments/bones_g1_valid.txt
        - src/config/data/stems/bones_segments/bones_g1_human2robot.txt
      layers     : ["${data.bones_g1_t.valid}", "${data.window.valid}"]

wandb:
  runid: Exp9_TLIO_bones_g1
