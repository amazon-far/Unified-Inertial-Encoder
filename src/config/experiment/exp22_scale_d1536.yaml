# @package _global_
# EXP22-d1536: model-size point of the scaling sweep, exp15_full_train_C with token_dim 1536.
# Usage: python -m src.train experiment=exp22_scale_d1536
defaults:
  - exp15_full_train_C

model:
  token_dim         : 1536
  feature_from_trunk: [3, 5, 7]
  trunk:
    layer     : 8
    layer_type: [device, full, device, full, device, full, device, full]
    num_heads : 16

trainer:
  max_epochs: 20

wandb:
  runid: Exp22_Scale_d1536
