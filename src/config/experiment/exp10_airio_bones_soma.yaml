# @package _global_
# EXP10: AirIO baseline on BONES-SEED SOMA, pelvis IMU only, 5 s windows.
# Usage: python -m src.train_airio experiment=exp10_airio_bones_soma
defaults:
  - override /data/transform@data.bones_soma_t: human_xsens_real_disturb

data_conf:
  window_size: 600

data:
  train:
    - _target_   : src.data.util.build_corpus
      _recursive_: false
      reader     : {_target_: src.data.imu.bones_seed_processed.Bones_Seed_SOMA_Processed_IMU_w_Lang, target_sensors: ["pelvis"]}
      root       : "${machine-conf:cache_root}/bones_seed_soma_processed_v4"
      stems      : src/config/data/stems/bones_segments/bones_soma_train.txt
      layers     : ["${data.bones_soma_t.train}", "${data.window.train}"]

  valid:
    - _target_   : src.data.util.build_corpus
      _recursive_: false
      reader     : {_target_: src.data.imu.bones_seed_processed.Bones_Seed_SOMA_Processed_IMU_w_Lang, target_sensors: ["pelvis"]}
      root       : "${machine-conf:cache_root}/bones_seed_soma_processed_v4"
      stems      : src/config/data/stems/bones_segments/bones_soma_valid.txt
      layers     : ["${data.bones_soma_t.valid}", "${data.window.valid}"]

wandb:
  runid: Exp10_AirIO_bones_soma

trainer:
  max_epochs: 94
