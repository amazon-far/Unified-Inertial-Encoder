# Continuous-kernel Conv1D tokenizer with 4 register tokens.
_target_: src.model.tokenizer.AddRegister
output_dim    : ${model.token_dim}
num_register  : 4

base_tokenizer:
  _target_: src.model.tokenizer.ContinuousKernel_Conv1DTokenizer

  output_dim    : ${model.token_dim}
  window_span_ms: ${model.token_size}
  activation    : silu
  num_taps      : 4     # with micro_split=4, no stage-1 tap is empty on any corpus
  micro_split   : 4     # stage-1 micro-window = window_span_ms / micro_split
  num_trunk_features: ${len:${model.feature_from_trunk}} # decoder-head input width multiplier
